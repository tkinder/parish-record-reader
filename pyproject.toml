[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "parish-record-reader"
version = "0.1.0"
description = "Turn photos of Spanish/Latin parish records into bilingual genealogy PDFs"
requires-python = ">=3.11"
# Runtime dependencies. requirements.txt mirrors this list for the
# Modal image build; keep the two in sync (pyproject is the source
# for local installs, requirements.txt is what Modal consumes).
dependencies = [
  "modal>=0.73",
  "fastapi>=0.110",
  "python-multipart>=0.0.9",
  "opencv-python-headless>=4.8",
  "numpy>=1.26",
  "Pillow>=10.0",
  "fpdf2>=2.7",
  "pypdf>=4.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["parish_record_reader*"]

[tool.setuptools.package-data]
parish_record_reader = ["fonts/*.ttf", "assets/*.pdf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
